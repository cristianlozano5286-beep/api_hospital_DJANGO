<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Arial', sans-serif; margin: 40px; color: #333; }
        .header { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #007bff; }
        .info-box { background-color: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #ddd; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th { background-color: #f2f2f2; text-align: left; padding: 8px; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Reporte de Especialidad Médica</h1>
        <p>Fecha de emisión: {% now "d/m/Y" %}</p>
    </div>

    <div class="info-box">
        <p><strong>ID:</strong> {{ object.id }}</p>
        <p><strong>Nombre:</strong> {{ object.nombre }}</p>
        <p><strong>Código:</strong> {{ object.codigo }}</p>
        <p><strong>Descripción:</strong> {{ object.descripcion }}</p>
        <p><strong>Estado:</strong> {% if object.activo %}Activo{% else %}Inactivo{% endif %}</p>
    </div>

</body>
</html>
